name: Universal Dongle Configuration Audit

on:
  push:
    branches:
      - main
    paths:
      - "build-universal-dongle-routing-smoke.yaml"
      - "boards/shields/universal_dongle/**"
      - "config/west.yml"
      - "scripts/validate_universal_dongle_config.py"
      - ".github/workflows/universal-dongle-configuration-audit.yml"
  pull_request:
    paths:
      - "build-universal-dongle-routing-smoke.yaml"
      - "boards/shields/universal_dongle/**"
      - "config/west.yml"
      - "scripts/validate_universal_dongle_config.py"
      - ".github/workflows/universal-dongle-configuration-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    name: Validate five-image configuration and routing safeguards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated keyboard configuration
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch pinned ZMK integration source
        run: |
          git init zmk-source
          git -C zmk-source remote add origin https://github.com/Sukumar002/zmk.git
          git -C zmk-source fetch --depth 1 origin 286e886983c074a91778d9eb3740bbae51bae9b4
          git -C zmk-source checkout --detach FETCH_HEAD
      - name: Run configuration and source audit
        run: python scripts/validate_universal_dongle_config.py
